<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Chatbot</title>

    <!-- FONT -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>

        /* RESET */

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* BODY */

        body{
            font-family: "Inter", sans-serif;
            background-color: #212121;
            color: #ececec;
            height: 100vh;
            overflow: hidden;
        }

        /* CHAT CONTAINER */

        .chat-container{
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #212121;
        }

        /* HEADER */

        .chat-header{
            height: 60px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            border-bottom: 1px solid #2f2f2f;
            background-color: #212121;
            font-size: 18px;
            font-weight: 600;
        }

        /* CHAT BOX */

        #chat-box{
            flex: 1;
            overflow-y: auto;
            padding: 30px 20px 140px;
            scroll-behavior: smooth;
        }

        /* MESSAGE */

        .message{
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 24px;
        }

        /* MESSAGE CONTENT */

        .message-content{
            width: 100%;
            max-width: 850px;
            line-height: 1.8;
            font-size: 16px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        /* USER MESSAGE */

        .user-message .message-content{
            background-color: #2f2f2f;
            padding: 16px 18px;
            border-radius: 16px;
        }

        /* BOT MESSAGE */

        .bot-message .message-content{
            padding: 4px 6px;
        }

        /* INPUT AREA */

        .input-area{
            width: 100%;
            position: fixed;
            bottom: 0;
            left: 0;
            padding: 20px;
            background: linear-gradient(
                to top,
                #212121 70%,
                rgba(33,33,33,0)
            );
        }

        /* INPUT WRAPPER */

        .input-wrapper{
            max-width: 850px;
            margin: auto;
            background-color: #2f2f2f;
            border-radius: 28px;
            border: 1px solid #444;
            display: flex;
            align-items: center;
            padding: 12px 16px;
        }

        /* INPUT */

        input{
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #ececec;
            font-size: 16px;
            font-family: "Inter", sans-serif;
        }

        /* PLACEHOLDER */

        input::placeholder{
            color: #9b9b9b;
        }

        /* BUTTON */

        button{
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 50%;
            background-color: #ffffff;
            color: #000000;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            transition: 0.2s ease;
        }

        button:hover{
            opacity: 0.9;
        }

        /* CODE BLOCK */

        .code-container{
            background-color: #0d1117;
            border-radius: 18px;
            margin-top: 18px;
            overflow: hidden;
            border: 1px solid #30363d;
        }

        /* CODE HEADER */

        .code-header{
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #161b22;
            padding: 14px 18px;
            border-bottom: 1px solid #30363d;
            font-size: 14px;
            font-weight: 600;
        }

        /* CODE TITLE */

        .code-header-left{
            display: flex;
            align-items: center;
            gap: 8px;
            color: #c9d1d9;
        }

        /* CODE BODY */

        .code-body{
            padding: 22px;
            overflow-x: auto;
        }

        /* PRE */

        .code-body pre{
            margin: 0;
            white-space: pre-wrap;
        }

        /* CODE */

        .code-body code{
            font-family: Consolas, monospace;
            font-size: 14px;
            line-height: 1.8;
            color: #ffffff;
        }

        /* SCROLLBAR */

        ::-webkit-scrollbar{
            width: 8px;
        }

        ::-webkit-scrollbar-track{
            background: #212121;
        }

        ::-webkit-scrollbar-thumb{
            background: #444;
            border-radius: 10px;
        }

        /* MOBILE */

        @media screen and (max-width: 768px){

            #chat-box{
                padding: 20px 14px 130px;
            }

            .message-content{
                font-size: 15px;
            }

            .input-area{
                padding: 14px;
            }

            .input-wrapper{
                padding: 10px 14px;
            }

            input{
                font-size: 15px;
            }

            button{
                width: 38px;
                height: 38px;
            }

            .code-body{
                padding: 16px;
            }

            .code-body code{
                font-size: 13px;
            }

        }

    </style>

</head>

<body>

    <div class="chat-container">

        <!-- HEADER -->

        <div class="chat-header">
            AI Chatbot
        </div>

        <!-- CHAT BOX -->

        <div id="chat-box"></div>

        <!-- INPUT AREA -->

        <div class="input-area">

            <div class="input-wrapper">

                <input
                    type="text"
                    id="message"
                    placeholder="Message AI Chatbot..."
                >

                <button onclick="sendMessage()">
                    ↑
                </button>

            </div>

        </div>

    </div>

    <script>

        // SEND MESSAGE

        async function sendMessage(){

            const inputField = document.getElementById("message");

            const message = inputField.value.trim();

            if(message === ""){
                return;
            }

            const chatBox = document.getElementById("chat-box");

            // USER MESSAGE

            chatBox.innerHTML += `
                <div class="message user-message">
                    <div class="message-content">
                        ${message}
                    </div>
                </div>
            `;

            inputField.value = "";

            chatBox.scrollTop = chatBox.scrollHeight;

            // LOADING MESSAGE

            const loadingId = "loading-" + Date.now();

            chatBox.innerHTML += `
                <div class="message bot-message" id="${loadingId}">
                    <div class="message-content">
                        Thinking...
                    </div>
                </div>
            `;

            chatBox.scrollTop = chatBox.scrollHeight;

            // API CALL

            const response = await fetch("/chat", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    message: message
                })

            });

            const data = await response.json();

            // FORMAT RESPONSE

            const formattedResponse = formatResponse(data.ai_response);

            // UPDATE BOT RESPONSE

            document.getElementById(loadingId).innerHTML = `
                <div class="message-content">
                    ${formattedResponse}
                </div>
            `;

            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // FORMAT RESPONSE

        function formatResponse(text){

            // CODE BLOCKS

            text = text.replace(/```(\w+)?([\s\S]*?)```/g, function(match, language, code){

                language = language || "CODE";

                return `
                    <div class="code-container">

                        <div class="code-header">

                            <div class="code-header-left">
                                &lt;/&gt; ${language.toUpperCase()}
                            </div>

                        </div>

                        <div class="code-body">
                            <pre><code>${escapeHtml(code)}</code></pre>
                        </div>

                    </div>
                `;

            });

            // LINE BREAKS

            text = text.replace(/\n/g, "<br>");

            return text;
        }

        // ESCAPE HTML

        function escapeHtml(text){

            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");
        }

        // ENTER KEY SUPPORT

        document.getElementById("message")
            .addEventListener("keypress", function(event){

                if(event.key === "Enter"){
                    sendMessage();
                }

            });

    </script>

</body>

</html>
